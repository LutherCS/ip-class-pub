<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamelYY</title>
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
</head>

<body>
    <header>
        <div class="container">
            <h1 class="title">Welcome to GamelYY</h1>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="field">
                <label class="label">Title</label>
                <div class="control">
                    <input type="text" class="input" id="titleInput">
                </div>
            </div>
            <div class="field">
                <div class="control">
                    <button class="button is-link is-fullwidth" id="addGameButton">Add game</button>
                </div>
            </div>
            <div class="container" id="allGames"></div>
        </div>
    </main>
</body>

</html>
